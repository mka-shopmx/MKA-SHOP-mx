<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>En construcción | MKA Shop</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #0a1a3a, #0f2a5c);
  color: white;
}

/* HEADER */
header {
  padding: 20px;
  text-align: center;
  background: #003087;
}

.header {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 15px 30px;

  background-image: url("../imagenes/en-construccion.webp");
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center right;

  background-color: #003087;
}

.logo img {
  height: 50px;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  background: linear-gradient(180deg, #0f2a5c, #1c4fa3);
  padding: 20px;
}

.sidebar h3 {
  margin-top: 20px;
  color: #7db3ff;
}

.sidebar a {
  display: block;
  color: #e0eaff;
  text-decoration: none;
  margin: 5px 0;
}

.sidebar a:hover {
  color: #00bfff;
}

/* CONTENIDO */
.content {
  flex: 1;
  padding: 20px;
  background: #ffffff;
}

.container {
  display: flex;
  min-height: 80vh;
}

/* SECCIÓN EN CONSTRUCCIÓN */
.about-us {
  max-width: 1200px;
  margin: auto;
  color: #111;
  line-height: 1.8;
}

.about-us h2 {
  color: #003087;
  margin-bottom: 30px;
  font-size: 38px;
  text-align: center;
}

.construction-banner {
  width: 100%;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 5px 20px rgba(0,0,0,0.18);
}

.construction-banner img {
  width: 100%;
  display: block;
  object-fit: cover;
}

/* FOOTER */
footer {
  background: #020c1f;
  padding: 40px;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
}

.footer-logo img {
  height: 40px;
}

.footer-column {
  margin: 10px;
}

.footer-column h4 {
  margin-bottom: 10px;
}

.footer-column a {
  display: block;
  color: #ccc;
  text-decoration: none;
  margin-bottom: 5px;
}

.footer-column a:hover {
  color: #25D366;
}

/* =========================
   RESPONSIVE MOBILE
========================= */

@media (max-width: 768px) {

  /* HEADER */
  .header {
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 20px 15px;
    background-position: center;
  }

  .header h1 {
    font-size: 28px;
    margin-top: 10px;
  }

  .logo img {
    height: 45px;
  }

  /* CONTENEDOR PRINCIPAL */
  .container {
    flex-direction: column;
  }

  /* SIDEBAR */
  .sidebar {
    width: 100%;
    box-sizing: border-box;
    text-align: center;
    padding: 15px;
  }

  .sidebar h3 {
    margin-top: 25px;
    font-size: 20px;
  }

  .sidebar a {
    padding: 8px 0;
    font-size: 16px;
  }

  /* CONTENIDO */
  .content {
    padding: 20px 15px;
  }

  .about-us {
    max-width: 100%;
  }

  .about-us h2 {
    font-size: 30px;
  }

  .construction-banner {
    border-radius: 14px;
  }

  /* FOOTER */
  footer {
    flex-direction: column;
    text-align: center;
    padding: 30px 20px;
  }

  .footer-column {
    margin: 15px 0;
  }

  .footer-logo img {
    height: 35px;
    margin-bottom: 20px;
  }

}

</style>
</head>

<body>

<header class="header">

  <div class="logo">
    <a href="../index.html">
      <img src="../imagenes/logo-mka.svg">
    </a>
  </div>

  <h1>Sección en construcción</h1>

</header>

<div class="container">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <a href="../index.html">Inicio</a>

    <a href="PlayStation1-index.html"><h3>PlayStation</h3></a>
    <a href="ps1-consolap.html">Consola</a>
    <a href="ps1-videojuegos-p1.html">Videojuegos</a>
    <a href="ps1-accesorios.html">Accesorios</a>

    <a href="PlayStation2-index.html"><h3>PlayStation 2</h3></a>
    <a href="ps2-consolap.html">Consola</a>
    <a href="ps2-videojuegos-p1.html">Videojuegos</a>
    <a href="ps2-accesorios.html">Accesorios</a>

    <a href="PlayStation3-index.html"><h3>PlayStation 3</h3></a>
    <a href="ps3-consolap.html">Consola</a>
    <a href="ps3-videojuegos-p1.html">Videojuegos</a>
    <a href="ps3-accesorios.html">Accesorios</a>

    <h3>Geek</h3>
    <a href="en-construccion.html">Ver todo</a>

  </aside>

  <!-- CONTENIDO -->
  <main class="content">

    <section class="about-us">

      <h2>Sección en construcción</h2>

      <div class="construction-banner">
        <img src="../imagenes/en-construccion.webp" alt="En construcción">
      </div>

    </section>

  </main>

</div>

<!-- FOOTER -->
<footer>

  <div class="footer-logo">
    <img src="imagenes/LOGO-MKA.svg">
  </div>

  <div class="footer-column">
    <h4>Nosotros</h4>
    <a href="#">Quiénes somos</a>
    <a href="#">Misión</a>
  </div>

  <div class="footer-column">
    <h4>Social</h4>
    <a href="#">Facebook</a>
    <a href="#">Instagram</a>
  </div>

  <div class="footer-column">
    <h4>Contacto</h4>

  </div>

</footer>

</body>
</html>
