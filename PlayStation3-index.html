<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #0a1a3a, #0f2a5c);
  color: white;
}

/* HEADER */
header {
  padding: 20px;
  text-align: center;
  background: #003087;
}

.header {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 15px 30px;

  background-image: url("../imagenes/ps3-header.webp");
  background-size: cover;      /* 👈 clave */
  background-repeat: no-repeat;
  background-position: center right;

  background-color: #003087;     /* fallback */
}

/* GRID */
.grid {
  display: grid;

  /* 👇 tamaño dinámico */
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

  gap: clamp(15px, 2vw, 30px);

  padding: clamp(15px, 3vw, 40px);

  align-items: stretch;
}

/* CARDS */
.card {
  position: relative;

  border-radius: 14px;

  overflow: hidden;

  cursor: pointer;

  width: 100%;

  /* 👇 proporción dinámica */
  aspect-ratio: 3 / 4;

  min-height: 260px;

  max-height: 520px;

  transition: 0.3s;
}

.card img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover; /* 👈 llena completamente */
  transition: 0.3s;
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  transition: 0.3s;
}

.card:hover {
  filter: brightness(1.4);
  transform: scale(1.05);
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* TEXTO */
.card h2 {
  position: absolute;
  top: 30px; /* mantiene altura visual */
  left: 50%;
  transform: translate(-50%, -50%);
  margin: 0;
  text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  color: #ffffff;
  font-size: clamp(18px, 2vw, 28px);
  z-index: 2;
  text-align: center;
}

.logo img {
  height: 50px;
}

/* CONTENEDOR DEBAJO DEL HEADER */
.container {
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  background: linear-gradient(180deg, #0f2a5c, #1c4fa3);
  padding: 20px;
}

.sidebar h3 {
  margin-top: 20px;
  color: #7db3ff;
}

.sidebar a {
  display: block;
  color: #e0eaff;
  text-decoration: none;
  margin: 5px 0;
}

.sidebar a:hover {
  color: #00bfff;
}

/* CONTENIDO */
.content {
  flex: 1;
  padding: 20px;
  background: #ffffff; /* fondo blanco */
}

/* FOOTER */
footer {
  background: #020c1f;
  padding: 40px;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
}

.footer-logo img {
  height: 40px;
}

.footer-column {
  margin: 10px;
}

.footer-column h4 {
  margin-bottom: 10px;
}

.footer-column a {
  display: block;
  color: #ccc;
  text-decoration: none;
  margin-bottom: 5px;
}

.footer-column a:hover {
  color: #25D366;
}

/* =========================
   RESPONSIVE MOBILE
========================= */

@media (max-width: 768px) {

  /* HEADER */
  .header {
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 20px 15px;
    background-position: center;
  }

  .header h1 {
    font-size: 28px;
    margin-top: 10px;
  }

  .logo img {
    height: 45px;
  }

  /* CONTENEDOR PRINCIPAL */
  .container {
    flex-direction: column;
  }

  /* SIDEBAR */
  .sidebar {
    width: 100%;
    box-sizing: border-box;
    text-align: center;
    padding: 15px;
  }

  .sidebar h3 {
    margin-top: 25px;
    font-size: 20px;
  }

  .sidebar a {
    padding: 8px 0;
    font-size: 16px;
  }

  /* CONTENIDO */
  .content {
    padding: 25px 18px;
  }

  .about-us {
    max-width: 100%;
  }

  .about-us h2 {
    font-size: 28px;
    text-align: center;
  }

  .about-us p {
    font-size: 16px;
    line-height: 1.7;
    text-align: justify;
  }

  /* FOOTER */
  footer {
    flex-direction: column;
    text-align: center;
    padding: 30px 20px;
  }

  .footer-column {
    margin: 15px 0;
  }

  .footer-logo img {
    height: 35px;
    margin-bottom: 20px;
  }
}

</style>
